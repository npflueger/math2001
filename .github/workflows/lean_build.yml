name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: checkout project
        uses: actions/checkout@v4

      # Installs elan + the pinned toolchain, fetches the Mathlib cache,
      # and runs `lake build` on the default target (Math2001).
      # `sorry` only produces warnings (intentional in the textbook), which
      # do not fail `lake build`.
      - name: build Math2001
        uses: leanprover/lean-action@v1

      - name: build Library
        run: lake build Library
